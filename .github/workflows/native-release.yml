name: Native Preview release

# Every push to main that changes the native apps publishes a Preview that
# installed apps update to: main is production. Tests run separately in Native CI
# and do not block it. Each platform is signed when its signing material is
# configured (macOS: APPLE_* secrets and identity variables; Windows:
# WINDOWS_CERTIFICATE_*) and published unsigned otherwise, like the other apps.
# One release runs at a time; the newest waiting push replaces older ones.
on:
  push:
    branches: [main]
    paths:
      - apps/native/**
      - '!apps/native/**/*.md'
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/native-release.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-preview-release
  cancel-in-progress: false
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.23'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool install --global vpk --version 1.2.158
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libx11-dev libxkbcommon-dev libwayland-dev libfuse2 squashfs-tools
      - if: runner.os == 'Linux'
        run: cargo build --release --locked -p findanything-linux
      - if: runner.os == 'Windows'
        run: cargo build --release --locked -p findanything-windows
      - if: runner.os == 'macOS'
        run: bash apps/native/macos/build.sh
      - name: Check for signing material
        id: signing
        shell: bash
        env:
          OS: ${{ runner.os }}
          HAS_APPLE: ${{ secrets.APPLE_CERTIFICATES_BASE64 != '' && secrets.APPLE_API_KEY_BASE64 != '' && vars.APPLE_APP_IDENTITY != '' && vars.APPLE_INSTALLER_IDENTITY != '' }}
          HAS_WINDOWS: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' }}
        run: |
          signed=false
          [[ "$OS" == macOS && "$HAS_APPLE" == true ]] && signed=true
          [[ "$OS" == Windows && "$HAS_WINDOWS" == true ]] && signed=true
          echo "signed=$signed" >> "$GITHUB_OUTPUT"
          if [[ "$signed" == false && "$OS" != Linux ]]; then
            echo "::notice::No $OS signing material is configured; publishing this platform unsigned."
          fi
      - name: Import Apple signing identities and notarization profile
        if: steps.signing.outputs.signed == 'true' && runner.os == 'macOS'
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATES_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATES_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/findanything.keychain-db"
          PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$PASSWORD"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          printf '%s' "$API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificates.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          xcrun notarytool store-credentials findanything-release --key "$RUNNER_TEMP/notary.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER"
          rm "$RUNNER_TEMP/certificates.p12" "$RUNNER_TEMP/notary.p8"
      - name: Import Windows signing certificate
        if: steps.signing.outputs.signed == 'true' && runner.os == 'Windows'
        env:
          CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if (!$env:CERTIFICATE) { throw 'Windows signing certificate required' }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE))
          $password = ConvertTo-SecureString $env:PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -Password $password -CertStoreLocation Cert:\CurrentUser\My
          "WINDOWS_CERT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Remove-Item $pfx
      - name: Package native Preview
        shell: bash
        env:
          APPLE_APP_IDENTITY: ${{ vars.APPLE_APP_IDENTITY }}
          APPLE_INSTALLER_IDENTITY: ${{ vars.APPLE_INSTALLER_IDENTITY }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          args=(--version "0.2.$GITHUB_RUN_NUMBER")
          [[ "$SIGNED" != true ]] || args+=(--signed)
          uv run --no-project python apps/native/package.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}
          path: releases/*
          if-no-files-found: error
      - if: always() && steps.signing.outputs.signed == 'true' && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/findanything.keychain-db" || true
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: releases
      - name: Publish all platform feeds together
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: 0.2.${{ github.run_number }}
        run: |
          set -euo pipefail
          TAG="native-v$VERSION"
          gh release create "$TAG" --target "$SHA" --draft --prerelease --title "Native Preview $VERSION" --notes "Experimental native build from $SHA. Automatic updates apply on next launch. Builds without configured signing are unsigned: on macOS, open the app once with right-click > Open (or System Settings > Privacy & Security > Open Anyway); on Windows, choose More info > Run anyway. See DEVELOPMENT.md for platform limits."
          gh release upload "$TAG" releases/*
          gh release edit "$TAG" --draft=false --prerelease --latest=false
