name: Native CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libvulkan1 mesa-vulkan-drivers xvfb xauth xdotool x11-utils openbox imagemagick
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: python -m unittest discover -s apps/native -p "test_*.py"
      - if: runner.os != 'macOS'
        run: cargo build --locked -p findanything-desktop
      - if: runner.os == 'Linux'
        run: |
          cargo build --locked -p findanything-desktop --no-default-features
          python3 apps/native/smoke.py --binary target/debug/findanything --output native-smoke --lifecycle
      - if: runner.os == 'macOS'
        run: |
          bash apps/native/macos/build.sh
          mkdir -p native-smoke
          for appearance in light dark; do
            for state in results empty error; do
              apps/native/macos/.build/release/FindAnythingNative --fixture "$state" --appearance "$appearance" --screenshot "native-smoke/$appearance-$state.png"
            done
          done
      - uses: actions/upload-artifact@v4
        if: always() && runner.os != 'Windows'
        with:
          name: native-smoke-${{ matrix.os }}
          path: native-smoke
          if-no-files-found: error
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:web
