[package]
name = "findanything-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["semantic"]
semantic = ["findanything-core/semantic"]

[dependencies]
findanything-core = { path = "../findanything-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
