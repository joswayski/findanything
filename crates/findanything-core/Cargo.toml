[package]
name = "findanything-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["semantic"]
semantic = ["dep:fastembed"]

[dependencies]
dirs = "6"
# 5.8.1+ bundles ONNX archives requiring glibc 2.38; keep Ubuntu 22.04/Debian 12 support.
fastembed = { version = "=5.8.0", optional = true, default-features = false, features = ["hf-hub-native-tls", "ort-download-binaries"] }
plist = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strsim = "0.11"
walkdir = "2"
fs2 = "0.4"
velopack = "=1.2.158"

[dev-dependencies]
tempfile = "3"
