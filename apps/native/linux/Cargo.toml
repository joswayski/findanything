[package]
name = "findanything-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "findanything"
path = "src/main.rs"

[features]
default = ["semantic"]
semantic = ["findanything-core/semantic"]

[target.'cfg(target_os = "linux")'.dependencies]
# 0.7 targets GTK 4.6, the GTK release shipped by Ubuntu 22.04.
gtk = { package = "gtk4", version = "0.7", features = ["v4_6"] }
global-hotkey = "0.7"
findanything-core = { path = "../../../crates/findanything-core", default-features = false }
